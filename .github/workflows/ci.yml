# 七个 job：Linux 跑 fmt / clippy / 全 workspace 测试（排除 IMK 外壳）；macOS 与 Windows runner 各编各的壳并跑平台测试，
# 平台特有的编译错（Objective-C 调用、TSF 导出、WinUI）在 PR 里就暴露，不等发版。仓库公开，Actions 不计费。
# 各平台的 clippy 与 test 拆成独立 job 并行，两者用同一个 shared-key 共用一份 target 缓存，避免编译产物存两份。
# push main 与手动触发另外各打一份未签名的包传成 artifact: macOS 的 arm64 与 x86_64 各占一个 runner 并行打,
# Windows 出 Inno 安装包 (只有一个架构, 但检查与打包也拆成独立 job 并行), 从 Actions 页面直接下载就能试;
# PR 只跑检查不打包. 正式发布仍走 release.yml 的标签流程 (那边要签名, 公证与版本门禁).
# actions 一律钉到 commit（注释里是对应的标签），Dependabot 每周提 PR 更新；cargo 全加 --locked，Cargo.lock 没提交就报错。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Fcitx5 build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev nlohmann-json3-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude qingjian-macos --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude qingjian-macos --locked

      - name: Build and test Fcitx5 default panel
        run: |
          cargo build -p qingjian-linux-server --locked
          cmake -S apps/linux/fcitx5 -B target/fcitx5-stage1 -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build target/fcitx5-stage1 --parallel 2
          env -u DBUS_SESSION_BUS_ADDRESS ctest --test-dir target/fcitx5-stage1 --output-on-failure
          bash -n apps/linux/scripts/install.sh apps/linux/scripts/uninstall.sh
          python3 apps/linux/tests/installation.py

  # IMK 外壳的 clippy 与 test 分两个 job 并行；两边用同一个 shared-key，共用一份 target 缓存
  macos-clippy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-check

      - name: Clippy (IMK shell)
        run: cargo clippy -p qingjian-macos --all-targets --locked -- -D warnings

  macos-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-check

      - name: Test (IMK shell)
        run: cargo test -p qingjian-macos --locked

  # 打测试包单独成一个 job：两个架构各占一个 runner 并行编，比在一个 runner 上串行编两遍省一半墙钟时间。
  # PR 上整个 job 不启动（macOS runner 计费是 Linux 的 10 倍）。
  # 打包走 release profile 与交叉 target，跟上面的 debug 产物不共享，所以这里没有 shared-key。
  macos-package:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    strategy:
      # 一个架构失败也让另一个跑完，好一眼看出是哪个架构的问题
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # bundle.sh 用提交数当 pkg 的构建号，浅克隆下恒为 1
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # 两个架构的 target 目录不同，缓存 key 要分开，否则互相顶掉
          key: ${{ matrix.arch }}

      - name: Fetch product data
        run: tools/release/data-fetch.sh

      # 没有签名 Secrets，出来的是 ad-hoc 签名的包，装的时候要在「隐私与安全性」里放行（与 release.yml 无证书时的分支一致）
      - name: Build pkg (${{ matrix.arch }})
        id: package
        run: |
          QINGJIAN_TARGET=${{ matrix.target }} apps/macos/scripts/bundle.sh --pkg
          echo "name=$(basename "$(ls target/pkg/*-macos-${{ matrix.arch }}.pkg)" .pkg)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: target/pkg/*-macos-${{ matrix.arch }}.pkg
          if-no-files-found: error
          overwrite: true
          # pkg 与 exe 本身就是压缩容器，再压一遍纯属浪费时间
          compression-level: 0

  # 32 位 DLL 的 check 归这里：同属编译检查，而且 i686 target 只在这个 job 装
  windows-clippy:
    runs-on: windows-latest
    env:
      # Server 的 build.rs 嵌 uiAccess manifest，没签名的 exe（含测试二进制）起不来（os error 740）；与 release.yml 一样关掉
      QINGJIAN_UIACCESS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          components: clippy
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-check

      - name: Clippy (Server, TSF DLL, Settings)
        run: cargo clippy -p qingjian-windows-server -p qingjian-windows-tsf -p qingjian-windows-settings --all-targets --locked -- -D warnings

      # 安装包另带一份 32 位 DLL（企业微信 / WPS 这类 32 位应用只能加载它）
      - name: Check (TSF DLL, 32-bit)
        run: cargo check -p qingjian-windows-tsf --target i686-pc-windows-msvc --locked

  windows-test:
    runs-on: windows-latest
    env:
      QINGJIAN_UIACCESS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-check

      - name: Test (Server, TSF DLL, Settings)
        run: cargo test -p qingjian-windows-server -p qingjian-windows-tsf -p qingjian-windows-settings --locked

  # Windows 只有一个安装包（x86_64，包内另带 32 位 DLL），没有按架构分的余地，
  # 但检查与打包拆开能让两者并行，也不用等检查跑完才开始编安装包。
  windows-package:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      # 没有代码签名证书：Server 不带 uiAccess（没签名的 exe 带 uiAccess=true 起不来）
      QINGJIAN_UIACCESS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          # build.ps1 另编一份 32 位 TSF DLL（企业微信 / WPS 这类 32 位应用只能加载它）
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Fetch product data
        shell: bash
        run: tools/release/data-fetch.sh

      # 与 release.yml 同版本（7.1.0，自带简体中文翻译；Chocolatey 只有 6.x，6 的安装包不带简中）。钉死 GitHub Release 上的文件。
      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          # 下载来的安装程序要以管理员身份执行，先核对 SHA-256（2026-09-11 从上面地址下载后算出），对不上就不装。
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actual = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inno Setup 安装程序 SHA-256 不符：$actual" }
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          & "${env:ProgramFiles}\Inno Setup 7\ISCC.exe" --version

      - name: Build installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps\windows\installer\build.ps1

      - name: Read installer name
        id: package
        shell: bash
        run: echo "name=$(basename "$(ls target/installer/*-setup.exe)" .exe)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: target/installer/*-setup.exe
          if-no-files-found: error
          overwrite: true
          compression-level: 0
